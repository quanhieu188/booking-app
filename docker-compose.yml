services:
  db:
    image: postgres:16
    container_name: booking-app-db
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: